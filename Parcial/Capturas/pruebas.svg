<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">Evidencia de los casos de verificación PLANAZO</title>
  <desc id="desc">Salida de la ejecución dotnet run -- --pruebas: los ocho casos aprobaron.</desc>
  <rect width="1120" height="390" rx="14" fill="#111827"/>
  <rect width="1120" height="46" rx="14" fill="#1f2937"/>
  <circle cx="25" cy="23" r="7" fill="#f87171"/><circle cx="49" cy="23" r="7" fill="#fbbf24"/><circle cx="73" cy="23" r="7" fill="#34d399"/>
  <text x="560" y="29" text-anchor="middle" fill="#d1d5db" font-family="Segoe UI, sans-serif" font-size="15">Salida de verificación — PLANAZO</text>
  <g font-family="Cascadia Code, Consolas, monospace" font-size="17">
    <text x="28" y="84" fill="#93c5fd">&gt; dotnet run -- --pruebas</text>
    <text x="28" y="123" fill="#86efac">[OK] Reserva válida y reducción de cupos</text>
    <text x="28" y="153" fill="#86efac">[OK] Rechazo de cantidad superior a los cupos</text>
    <text x="28" y="183" fill="#86efac">[OK] Rechazo de cantidad negativa</text>
    <text x="28" y="213" fill="#86efac">[OK] Cancelación devuelve los cupos</text>
    <text x="28" y="243" fill="#86efac">[OK] Rechazo de segunda cancelación</text>
    <text x="28" y="273" fill="#86efac">[OK] Consulta de evento inexistente</text>
    <text x="28" y="303" fill="#86efac">[OK] Precios finales de los tipos de evento</text>
    <text x="28" y="333" fill="#86efac">[OK] Usuario y resumen de reservas activas</text>
    <text x="28" y="370" fill="#f9fafb" font-weight="bold">Resultado: 8/8 casos aprobados.</text>
  </g>
</svg>
